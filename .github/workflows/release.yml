# Releases the plugin when run by hand on main (Actions > Release > Run workflow), with the version to release and an optional changelog.
# The release job sets the version, builds and packages the plugin, publishes the GitHub release with the zip and the LGPL decoder sources, and then commits the version and manifest.json to main.
# The release notes list the merged pull requests and the commits since the previous release tag.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, four parts without a leading v, such as 1.1.0.0
        required: true
        type: string
      changelog:
        description: One-line changelog, Release <version> when left empty
        required: false
        type: string

permissions:
  contents: read

# One release at a time
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PLUGIN_NAME: WebGPU Player
  # The Jellyfin Web source tree the client add-on builds against, read-only: an upstream master commit
  JELLYFIN_WEB_REPOSITORY: jellyfin/jellyfin-web
  JELLYFIN_WEB_REF: fca925f3fd57e54b0c3faeb0a04ef5b0f673fb83
  JELLYFIN_WEB_DIRECTORY: jellyfin-web

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Pushes the release commit and tag, and creates the release; the release notes look up the pull requests
    permissions:
      contents: write
      pull-requests: read
    # NOTE: Scripts read the inputs from the environment only, because ${{ }} inside a script would splice the changelog into shell code
    env:
      VERSION: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog || format('Release {0}', inputs.version) }}
      # The release notes carry the changelog only when one was given
      RELEASE_SUMMARY: ${{ inputs.changelog }}
      TAG: v${{ inputs.version }}
    steps:
      # The last step rebases the release commit onto main and pushes it, which would carry another branch's commits into main
      - name: Stop unless run on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release on main, not $GITHUB_REF_NAME"
          exit 1

      # The full history and tags give the release notes the commits since the previous release
      - name: Check out the plugin
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stop if the release tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists"
            exit 1
          fi

      # The build reads only the submodules' pinned trees; checkout's fetch-depth 0 would clone their full history too
      - name: Check out the client submodules
        run: git submodule update --init --depth 1 --jobs 2

      # setup-uv publishes exact version tags only
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set the version and changelog
        run: uv run .github/scripts/release.py set-version "$VERSION" --changelog "$CHANGELOG"

      - name: Read the engine's decoder build settings
        run: |
          engine_directory="$(git config --file .gitmodules --get submodule.webgpu-player.path)"
          # The engine names its folders in tools/constants.json
          wasm_directory="$engine_directory/$(node -p 'require(process.argv[1])[process.argv[2]]' \
            "$PWD/$engine_directory/tools/constants.json" wasmDirectory)"
          # The decoder Makefile pins the toolchain and names the source archive folder
          make_variable() {
            make --no-print-directory --silent -C "$wasm_directory" --eval "print-variable: ; @echo \$($1)" print-variable
          }
          emscripten_version="$(make_variable EMSCRIPTEN_VERSION)"
          source_archives_directory="$(make_variable ARCHIVES)"
          if [[ -z "$emscripten_version" || -z "$source_archives_directory" ]]; then
            echo "::error::The decoder Makefile in $wasm_directory no longer defines EMSCRIPTEN_VERSION or ARCHIVES"
            exit 1
          fi
          {
            echo "WASM_DIRECTORY=$wasm_directory"
            echo "PINNED_EMSCRIPTEN_VERSION=$emscripten_version"
            echo "SOURCE_ARCHIVES_DIRECTORY=$source_archives_directory"
          } >> "$GITHUB_ENV"

      # Both installs are mostly downloads, so the Rust toolchain installs in the background while Emscripten does
      - name: Install the pinned Emscripten and Rust toolchains
        run: |
          # The Dolby Vision parser crate's rust-toolchain.toml names the toolchain and its WASM target
          (cd "$WASM_DIRECTORY/libdovi" && rustup toolchain install --no-self-update) &
          rust_install_process_id=$!
          emsdk_directory="$RUNNER_TEMP/emsdk"
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$emsdk_directory"
          "$emsdk_directory/emsdk" install "$PINNED_EMSCRIPTEN_VERSION"
          "$emsdk_directory/emsdk" activate "$PINNED_EMSCRIPTEN_VERSION"
          wait "$rust_install_process_id"
          # The decoder Makefile finds emcc through EMSDK
          echo "EMSDK=$emsdk_directory" >> "$GITHUB_ENV"

      - name: Check out Jellyfin Web
        uses: actions/checkout@v7
        with:
          repository: ${{ env.JELLYFIN_WEB_REPOSITORY }}
          ref: ${{ env.JELLYFIN_WEB_REF }}
          path: ${{ env.JELLYFIN_WEB_DIRECTORY }}
          persist-credentials: false

      - name: Build the plugin
        run: ./build.sh --publish --jellyfin-web-path "$JELLYFIN_WEB_DIRECTORY"

      - name: Write the corresponding source of the LGPL decoders
        run: make -C "$WASM_DIRECTORY" source-archives

      - name: Package the plugin and record it in manifest.json
        run: |
          uv run .github/scripts/release.py package \
            --source-url-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --output-directory "$RUNNER_TEMP/package" \
            --manifest manifest.json \
            --repository "$GITHUB_REPOSITORY"

      # Before the release commit, so HEAD is the commit that was built
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run .github/scripts/release.py release-notes "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --changelog "$RELEASE_SUMMARY" \
            --output-file "$RUNNER_TEMP/release-notes.md"

      - name: Commit the version and manifest.json, and tag the release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.yaml Directory.Build.props manifest.json
          git commit --message "Release $VERSION"
          git tag --annotate "$TAG" --message "$PLUGIN_NAME $VERSION"

      # The release goes up before manifest.json reaches main, so the manifest never names a missing zip
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "$RUNNER_TEMP"/package/*.zip "$SOURCE_ARCHIVES_DIRECTORY"/*.tar.gz \
            --verify-tag --title "$PLUGIN_NAME $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      # Commits pushed to main during the build go under the release commit; the tag keeps the commit that was built
      - name: Publish manifest.json on main
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
