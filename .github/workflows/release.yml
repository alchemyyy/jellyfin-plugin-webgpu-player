# Drafts a release of the plugin when run by hand on main (Actions > Release > Run workflow), with the version to release and an optional changelog.
# Validate checks the branch, the version, which ends in .0 because unstable builds (release-unstable.yml) number the fourth part, the changelog, and that the release tag is free, before anything builds.
# Build (build-plugin.yml) sets the version, builds and packages the plugin, and records the zip in manifest.json, while Release notes lists the merged pull requests and the plugin's and the engine's commits since the previous release tag, each credited to its authors and co-authors, and welcomes the release's new contributors.
# Draft release, the only job that can write to the repository, commits the version and manifest.json, tags that commit, and drafts the GitHub release with the zip.
# Nothing goes out until the draft is published (Releases > Edit the draft > Publish release), which runs publish-manifest.yml to put the release commit, and with it manifest.json, on main.
name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, four parts without a leading v, such as 1.1.0.0
        required: true
        type: string
      changelog:
        description: One-line changelog, Release <version> when left empty
        required: false
        type: string

permissions:
  contents: read

# One release at a time, unstable builds included, so a release and an unstable build never number or tag against each other
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# NOTE: Scripts read the inputs from the environment only, because ${{ }} inside a script would splice the changelog into shell code
env:
  PLUGIN_NAME: WebGPU Player
  VERSION: ${{ inputs.version }}
  CHANGELOG: ${{ inputs.changelog || format('Release {0}', inputs.version) }}
  # The release notes carry the changelog only when one was given
  RELEASE_SUMMARY: ${{ inputs.changelog }}
  TAG: v${{ inputs.version }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Once the draft is published, Update main (publish-manifest.yml) rebases the release commit onto main and pushes it, which would carry another branch's commits into main
      - name: Stop unless run on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release on main, not $GITHUB_REF_NAME"
          exit 1

      - name: Check out the plugin
        uses: actions/checkout@v7

      - name: Stop if the release tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists"
            exit 1
          fi

      # setup-uv publishes exact version tags only
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      # set-version rejects a malformed version, one that does not end in .0, or a changelog build.yaml cannot hold, before anything builds; what it writes here goes unused
      - name: Check the version and changelog
        run: uv run .github/scripts/release.py set-version "$VERSION" --changelog "$CHANGELOG" --stable

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build-plugin.yml
    # A reusable workflow's inputs cannot read the env context, so these repeat VERSION, CHANGELOG, and TAG
    with:
      version: ${{ inputs.version }}
      changelog: ${{ inputs.changelog || format('Release {0}', inputs.version) }}
      tag: v${{ inputs.version }}
      manifest: manifest.json

  release-notes:
    name: Release notes
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The notes look up the pull requests that carried the commits, and the GitHub accounts of the commits' authors
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The full history and tags give the notes the commits since the previous release; HEAD is the commit Build builds. The notes clone the engine's history themselves, without its files, for the engine's commits and earlier contributors
      - name: Check out the plugin
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run .github/scripts/release.py release-notes "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --changelog "$RELEASE_SUMMARY" \
            --output-file "$RUNNER_TEMP/release-notes.md"

      - name: Upload the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [build, release-notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Pushes the release tag and drafts the release
    permissions:
      contents: write
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v7

      # build.yaml, Directory.Build.props, and manifest.json as Build wrote them, over this checkout of the same commit, and the zip in bin/package/
      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Commit the version and manifest.json, and tag the release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.yaml Directory.Build.props manifest.json
          git commit --message "Release $VERSION"
          git tag --annotate "$TAG" --message "$PLUGIN_NAME $VERSION"

      # A draft and its zip are visible only to users with push access, so manifest.json reaches main only once the draft is published, and never names a zip a server cannot download
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "refs/tags/$TAG"
          release_url="$(gh release create "$TAG" bin/package/*.zip --draft \
            --verify-tag --title "$PLUGIN_NAME $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md")"
          echo "Drafted [$PLUGIN_NAME $VERSION]($release_url); publish the draft to release it" >> "$GITHUB_STEP_SUMMARY"
