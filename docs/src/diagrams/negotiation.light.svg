<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1530px" preserveAspectRatio="none" style="width:946px;height:1530px;" version="1.1" viewBox="0 0 946 1530" width="946px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="301.4531" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="426.5215" x="251.5884" y="6"/><path d="M367.0991,6 L367.0991,15.3516 L357.0991,25.3516 L251.5884,25.3516" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="105.5107" x="254.5884" y="20.4951">1. Select a player</text><ellipse cx="464.8491" cy="45.3516" fill="#8C391F" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#C7DAEB" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="406.5215" x="261.5884" y="75.3516"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.5215" x="271.5884" y="98.8467">PlaybackManager offers the item to WebGPUPlayer first (priority 0)</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="248.3125" x="340.6929" y="189.9531"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.3125" x="350.6929" y="213.4482">Plain HTML player with the stock profile</text><ellipse cx="464.8491" cy="262.4531" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="464.8491" cy="262.4531" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#D6D6CE" points="354.1238,131.7031,575.5745,131.7031,587.5745,148.0547,575.5745,164.4063,354.1238,164.4063,342.1238,148.0547,354.1238,131.7031" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="38.0273" x="468.8491" y="176.8633">decline</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.6943" x="354.1238" y="145.1982">User prefers HTML, native app shell,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.4507" x="354.1238" y="161.5498">or the engine's prefilter finds no route?</text><rect fill="none" height="430.8125" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="822.2593" x="117.8283" y="317.4531"/><path d="M285.3073,317.4531 L285.3073,326.8047 L275.3073,336.8047 L117.8283,336.8047" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="157.479" x="120.8283" y="331.9482">2. Build the device profile</text><polygon fill="#D6D6CE" points="418.2446,353.8047,511.4536,353.8047,523.4536,365.8047,511.4536,377.8047,418.2446,377.8047,406.2446,365.8047,418.2446,353.8047" style="stroke:#8C391F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.209" x="418.2446" y="371.124">options.isRetry?</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="24" x="382.2446" y="363.168">retry</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="81.3809" x="523.4536" y="363.168">first negotiation</text><rect fill="#EFCCCA" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="183.3125" x="137.8283" y="387.8047"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3125" x="147.8283" y="411.2998">Stock profile, never widened</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="402.9731" x="498.7271" y="387.8047"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.9731" x="508.7271" y="411.2998">Adopt the stored preferences, remember the stock profile as proof,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.1143" x="508.7271" y="427.6514">strip every bitrate field and condition</text><polygon fill="#D6D6CE" points="578.4434,460.5078,821.9839,460.5078,833.9839,472.5078,821.9839,484.5078,578.4434,484.5078,566.4434,472.5078,578.4434,460.5078" style="stroke:#8C391F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.5405" x="578.4434" y="477.8271">Custom decode on and runtime available?</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="547.7696" y="469.8711">yes</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="833.9839" y="469.8711">no</text><rect fill="#C7DAEB" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="387.415" x="357.2695" y="494.5078"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.415" x="367.2695" y="518.0029">Await the item's capability probes and native-media audio probe</text><rect fill="#C7DAEB" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="399.6724" x="351.1408" y="550.8594"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.6724" x="361.1408" y="574.3545">Await the GPU authorizations of the item's probe scope (5 s each)</text><rect fill="#CCE3CF" height="69.0547" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="352.3696" x="374.7922" y="607.2109"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.8843" x="384.7922" y="630.7061">augmentDeviceProfileForCustomDecode:</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.3696" x="384.7922" y="647.0576">DirectPlayProfiles per container rule, route CodecProfiles,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2134" x="384.7922" y="663.4092">exact item routes for Dolby Vision labels</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="157.2744" x="770.8132" y="494.5078"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.2744" x="780.8132" y="518.0029">Bitrate-free stock profile</text><polygon fill="#D6D6CE" points="700.2137,682.2656,712.2137,694.2656,700.2137,706.2656,688.2137,694.2656,700.2137,682.2656" style="stroke:#8C391F;stroke-width:1;"/><polygon fill="#D6D6CE" points="464.8491,712.2656,476.8491,724.2656,464.8491,736.2656,452.8491,724.2656,464.8491,712.2656" style="stroke:#8C391F;stroke-width:1;"/><rect fill="none" height="323.6563" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="452.9404" x="238.3789" y="758.2656"/><path d="M343.0288,758.2656 L343.0288,767.6172 L333.0288,777.6172 L238.3789,777.6172" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="94.6499" x="241.3789" y="772.7607">3. PlaybackInfo</text><rect fill="#D2D8E6" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="432.9404" x="248.3789" y="794.6172"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.7861" x="258.3789" y="818.1123">The interceptor rewrites PlaybackManager's request:</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.9404" x="258.3789" y="834.4639">no MaxStreamingBitrate, AllowVideoStreamCopy=false for Dolby Vision</text><rect fill="#C7DAEB" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="345.0952" x="292.3015" y="867.3203"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.0952" x="302.3015" y="890.8154">The server picks DirectPlay, DirectStream, or Transcode</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.3843" x="302.3015" y="907.167">(StreamBuilder ANDs every matching CodecProfile)</text><rect fill="#F0DBAE" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="378.4331" x="275.6326" y="989.5703"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.4331" x="285.6326" y="1013.0654">A second request sizes the transcode with the detected bitrate</text><polygon fill="#D6D6CE" points="404.5083,940.0234,525.1899,940.0234,537.1899,952.0234,525.1899,964.0234,404.5083,964.0234,392.5083,952.0234,404.5083,940.0234" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="468.8491" y="976.4805">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6816" x="404.5083" y="957.3428">Transcode selected?</text><polygon fill="#D6D6CE" points="464.8491,1045.9219,476.8491,1057.9219,464.8491,1069.9219,452.8491,1057.9219,464.8491,1045.9219" style="stroke:#8C391F;stroke-width:1;"/><rect fill="none" height="432.1016" rx="3" ry="3" style="stroke:#8F887F;stroke-width:1;" width="917.6982" x="6" y="1091.9219"/><path d="M60.0718,1091.9219 L60.0718,1101.2734 L50.0718,1111.2734 L6,1111.2734" fill="none" style="stroke:#8F887F;stroke-width:1;"/><text fill="#262625" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44.0718" x="9" y="1106.417">4. Start</text><rect fill="#D2D8E6" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="330.686" x="299.5061" y="1128.2734"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.686" x="309.5061" y="1151.7686">WebGPUPlayer.play consumes the stock-profile proof</text><rect fill="#EFCCCA" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="309.7769" x="309.9607" y="1242.875"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.7769" x="319.9607" y="1266.3701">Set currentPlaybackRequiresSourceRenegotiation</text><polygon fill="#D6D6CE" points="326.4607,1184.625,603.2375,1184.625,615.2375,1200.9766,603.2375,1217.3281,326.4607,1217.3281,314.4607,1200.9766,326.4607,1184.625" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="468.8491" y="1229.7852">yes</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.1943" x="326.4607" y="1198.1201">Augmented, DirectPlay or DirectStream,</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.7769" x="326.4607" y="1214.4717">and the stock profile does not cover the source?</text><polygon fill="#D6D6CE" points="464.8491,1299.2266,476.8491,1311.2266,464.8491,1323.2266,452.8491,1311.2266,464.8491,1299.2266" style="stroke:#8C391F;stroke-width:1;"/><polygon fill="#D6D6CE" points="28,1343.2266,193.4834,1343.2266,205.4834,1355.2266,193.4834,1367.2266,28,1367.2266,16,1355.2266,28,1343.2266" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="37.3594" x="114.7417" y="1379.6836">eligible</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.4834" x="28" y="1360.5459">Engine eligibility within 25 s?</text><rect fill="#CCE3CF" height="36.3516" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="113.2153" x="54.134" y="1402.3203"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.2153" x="64.134" y="1425.8154">Custom pipeline</text><ellipse cx="110.7417" cy="1484.6719" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="110.7417" cy="1484.6719" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#D6D6CE" points="312.5757,1343.2266,445.5591,1343.2266,457.5591,1355.2266,445.5591,1367.2266,312.5757,1367.2266,300.5757,1355.2266,312.5757,1343.2266" style="stroke:#8C391F;stroke-width:1;"/><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="383.0674" y="1379.6836">no</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.9834" x="312.5757" y="1360.5459">Renegotiation flag set?</text><text fill="#5C5A55" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="457.5591" y="1352.5898">yes</text><rect fill="#F0DBAE" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="307.168" x="225.4834" y="1402.3203"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.168" x="235.4834" y="1425.8154">The add-on's HTML player plays the same source</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.8926" x="235.4834" y="1442.167">in the same session</text><ellipse cx="379.0674" cy="1501.0234" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="379.0674" cy="1501.0234" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><rect fill="#EFCCCA" height="52.7031" rx="3" ry="3" style="stroke:#8C391F;stroke-width:1;" width="361.0469" x="552.6514" y="1397.7734"/><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1543" x="562.6514" y="1421.2686">Raise PlayerEvent.Error; the error retry ladder</text><text fill="#262625" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.0469" x="562.6514" y="1437.6201">renegotiates with isRetry, so step 2 returns the stock profile</text><ellipse cx="733.1748" cy="1496.4766" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="733.1748" cy="1496.4766" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="464.8491" x2="464.8491" y1="55.3516" y2="75.3516"/><polygon fill="#4A3F39" points="460.8491,65.3516,464.8491,75.3516,468.8491,65.3516,464.8491,69.3516" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="464.8491" x2="464.8491" y1="226.3047" y2="251.4531"/><polygon fill="#4A3F39" points="460.8491,241.4531,464.8491,251.4531,468.8491,241.4531,464.8491,245.4531" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="464.8491" x2="464.8491" y1="164.4063" y2="189.9531"/><polygon fill="#4A3F39" points="460.8491,179.9531,464.8491,189.9531,468.8491,179.9531,464.8491,183.9531" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="587.5745" x2="599.5745" y1="148.0547" y2="148.0547"/><polygon fill="#4A3F39" points="595.5745,221.4531,599.5745,231.4531,603.5745,221.4531,599.5745,225.4531" style="stroke:#4A3F39;stroke-width:1.5;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="599.5745" x2="599.5745" y1="148.0547" y2="295.4531"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="599.5745" x2="464.8491" y1="295.4531" y2="295.4531"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="464.8491" x2="464.8491" y1="295.4531" y2="353.8047"/><polygon fill="#4A3F39" points="460.8491,343.8047,464.8491,353.8047,468.8491,343.8047,464.8491,347.8047" style="stroke:#4A3F39;stroke-width:1;"/><line style="stroke:#4A3F39;stroke-width:1.5;" x1="464.8491" x